<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vanta — Premium Streaming</title>
<style>
:root{--bg:#07070b;--panel:rgba(19,19,28,.62);--panel2:rgba(255,255,255,.065);--line:rgba(255,255,255,.11);--text:#f7f7fb;--muted:#a5a5b5;--accent:#8b5cf6;--accent2:#38bdf8;--radius:22px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 80% 0,#28104c 0,transparent 35%),radial-gradient(circle at 0 50%,#0d2434 0,transparent 32%),var(--bg);color:var(--text);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:0;color:inherit}.hidden{display:none!important}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid var(--line);box-shadow:0 20px 60px #0005;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
#app{min-height:100vh}.page{padding:96px 4vw 100px;max-width:1600px;margin:auto}.nav{position:fixed;z-index:50;top:16px;left:50%;transform:translateX(-50%);width:min(1450px,94%);height:64px;padding:0 18px;border-radius:20px;display:flex;align-items:center;gap:18px}.logo{font-weight:900;letter-spacing:-1px;font-size:22px;display:flex;align-items:center;gap:9px;white-space:nowrap}.logo i{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 30px #8b5cf677}.navlinks{display:flex;gap:5px;align-items:center;flex:1}.nav a{color:var(--muted);text-decoration:none;padding:9px 12px;border-radius:12px;transition:.25s}.nav a:hover,.nav a.active{color:#fff;background:#fff0}.navright{display:flex;gap:8px;align-items:center}.iconbtn{width:40px;height:40px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center}.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid #ffffff33}.mobilebar{display:none}

.hero{min-height:560px;border-radius:30px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:56px}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#05050a 5%,#05050acc 38%,transparent 75%),linear-gradient(0deg,#05050a,transparent 50%),url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1800&q=85") center/cover}.hero>*{position:relative;z-index:1}.hero-copy{max-width:610px}.eyebrow{color:#c4b5fd;text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:800}.hero h1{font-size:clamp(44px,7vw,82px);line-height:.94;letter-spacing:-4px;margin:12px 0 20px}.hero p{color:#d0d0d9;max-width:570px}.meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:#ddd;margin:18px 0}.pill{padding:4px 9px;border-radius:8px;background:#fff1;border:1px solid #fff2;font-size:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.btn{padding:12px 18px;border-radius:13px;font-weight:800;background:linear-gradient(135deg,var(--accent),#6d28d9);box-shadow:0 10px 35px #7c3aed44}.btn.secondary{background:#ffffff0b;border:1px solid #ffffff20;box-shadow:none}.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.section{margin-top:42px}.sectionhead{display:flex;align-items:end;justify-content:space-between;margin-bottom:16px}.section h2{margin:0;font-size:22px}.muted{color:var(--muted)}.rail{display:flex;gap:15px;overflow:auto;padding:4px 2px 12px;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}.card{min-width:185px;max-width:185px;transition:.28s;position:relative}.card.wide{min-width:280px;max-width:280px}.card:hover{transform:translateY(-7px) scale(1.025);z-index:3}.poster{height:270px;border-radius:17px;overflow:hidden;position:relative;border:1px solid #ffffff12;background:#15151d}.wide .poster{height:158px}.poster img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;top:10px;left:10px;padding:5px 8px;border-radius:8px;background:#08080bcc;border:1px solid #fff2;font-size:10px;font-weight:900}.cardinfo{padding:10px 2px}.cardtitle{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{color:var(--muted);font-size:12px}.progress{height:3px;background:#ffffff22;margin-top:8px;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:20px}.grid .card{min-width:0;max-width:none}.grid .poster{height:285px}
.page-title{font-size:42px;letter-spacing:-2px;margin:8px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}.searchbox{height:58px;display:flex;align-items:center;gap:12px;padding:0 18px;border-radius:17px;flex:1;min-width:240px}.searchbox input{width:100%;background:none;border:0;outline:0;color:white;font-size:17px}.select{padding:12px 15px;border-radius:13px;background:#ffffff08;color:#ddd;border:1px solid var(--line)}
.livegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.channel{padding:10px;border-radius:18px}.channel img{width:100%;height:130px;object-fit:cover;border-radius:12px}.channelrow{display:flex;align-items:center;gap:10px;margin-top:10px}.channelrow img{width:38px;height:38px;border-radius:10px;object-fit:cover}.live{color:#fb7185;font-size:10px;font-weight:900}.epg{display:grid;grid-template-columns:150px 1fr;gap:8px;margin-top:10px}.epg div{padding:10px;background:#fff1;border-radius:10px;color:#bbb}
.profile{display:grid;grid-template-columns:300px 1fr;gap:20px}.profilebox,.setting{padding:24px;border-radius:22px}.profilebox{text-align:center}.profilebox .avatar{width:100px;height:100px}.settinglist{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.setting h3{margin-top:0}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid #fff1}.toggle{width:45px;height:25px;border-radius:99px;background:#ffffff18;padding:3px}.toggle:after{content:"";display:block;width:19px;height:19px;border-radius:50%;background:#aaa}.toggle.on{background:#7c3aed}.toggle.on:after{margin-left:20px;background:white}
.detail{min-height:620px;padding:48px;border-radius:30px;position:relative;overflow:hidden}.detail:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#07070bdd 10%,#07070aaa 45%,#07070a33),url("https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=1800&q=85") center/cover}.detailcontent{position:relative;display:grid;grid-template-columns:240px 1fr;gap:32px;align-items:end;min-height:520px}.detailposter{width:240px;height:350px;border-radius:18px;object-fit:cover}.detail h1{font-size:clamp(40px,6vw,70px);line-height:.95;letter-spacing:-3px;margin:10px 0}.detailtext{max-width:700px}.cast{display:flex;gap:15px;overflow:auto}.person{min-width:90px;text-align:center}.person img{width:70px;height:70px;border-radius:50%;object-fit:cover}.episodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.episode{display:flex;gap:12px;padding:10px;border-radius:16px}.episode img{width:125px;height:78px;object-fit:cover;border-radius:10px}.player{position:fixed;inset:0;background:#000;z-index:100;display:flex;align-items:center;justify-content:center}.video-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#34204d,#050508 60%)}.playerui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:28px 4vw;background:linear-gradient(#0008,transparent 30%,transparent 65%,#000c)}.playercontrols{display:flex;align-items:center;gap:12px}.timeline{height:5px;background:#ffffff33;border-radius:99px}.timeline span{display:block;width:42%;height:100%;background:var(--accent);border-radius:99px}.centerplay{width:70px;height:70px;border-radius:50%;background:#fff;color:#000;font-size:25px}.close{position:absolute;right:25px;top:22px}.empty{text-align:center;padding:70px 20px;border-radius:22px}.skeleton{height:285px;border-radius:17px;background:linear-gradient(100deg,#ffffff08 30%,#ffffff15 45%,#ffffff08 60%);background-size:200% 100%;animation:shimmer 1.4s infinite}@keyframes shimmer{to{background-position:-200% 0}}
#welcome{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#3a1a65,transparent 45%),#050509;padding:20px}.welcome-card{width:min(480px,100%);padding:40px;border-radius:28px;text-align:center}.welcome-card h1{font-size:42px;letter-spacing:-2px}.welcome-card input{width:100%;height:54px;border-radius:14px;background:#fff0;border:1px solid var(--line);padding:0 16px;color:#fff;outline:0}.welcome-card .btn{width:100%;margin-top:12px}
@media(max-width:800px){.nav{top:8px;width:96%}.navlinks{display:none}.navright .hideMob{display:none}.page{padding:86px 16px 92px}.hero{min-height:580px;padding:28px 22px}.hero:before{background:linear-gradient(0deg,#05050a 10%,#05050a99 55%,transparent),url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1200&q=85") center/cover}.hero h1{letter-spacing:-2px}.profile{grid-template-columns:1fr}.settinglist{grid-template-columns:1fr}.detail{padding:25px}.detailcontent{grid-template-columns:1fr;align-items:start}.detailposter{width:150px;height:220px}.mobilebar{position:fixed;z-index:60;display:flex;bottom:10px;left:50%;transform:translateX(-50%);width:94%;height:62px;border-radius:20px;align-items:center;justify-content:space-around;padding:6px}.mobilebar a{font-size:10px;text-decoration:none;color:#aaa;text-align:center}.mobilebar a b{display:block;font-size:19px;color:#fff}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.grid .poster{height:245px}.card{min-width:155px;max-width:155px}.poster{height:225px}.wide{min-width:250px!important;max-width:250px!important}.wide .poster{height:142px}.epg{grid-template-columns:1fr}.livegrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const movies=[
["Neon Horizon","https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=600&q=80","2026","8.7","2h 08m"],
["Midnight Signal","https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80","2025","8.2","1h 54m"],
["After The Rain","https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=600&q=80","2026","8.9","2h 14m"],
["The Last Orbit","https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=600&q=80","2025","8.5","1h 48m"],
["Velvet City","https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=600&q=80","2026","7.9","1h 42m"],
["Parallel","https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=600&q=80","2024","8.1","2h 01m"],
["Echo Valley","https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=600&q=80","2025","8.0","1h 56m"],
["Blue Static","https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=600&q=80","2026","8.4","1h 51m"]
];
const series=[
["Dark Matter","https://images.unsplash.com/photo-1440404653325-ab127d49abc1?auto=format&fit=crop&w=600&q=80","2026","9.1","3 Seasons"],
["Glass House","https://images.unsplash.com/photo-1518709594023-6eab9bab7b23?auto=format&fit=crop&w=600&q=80","2025","8.6","2 Seasons"],
["Northbound","https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=600&q=80","2026","8.4","1 Season"],
["The Archive","https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=600&q=80","2024","8.8","4 Seasons"],
["Signal 09","https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=600&q=80","2026","8.0","2 Seasons"]
];
const channels=["Pulse News","Arena Sports","Vibe Music","Cinema One","Kids Planet","World Live"];
const imgs=["https://images.unsplash.com/photo-1495020689067-958852a7765e?auto=format&fit=crop&w=600&q=80","https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=600&q=80","https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=600&q=80","https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=600&q=80","https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?auto=format&fit=crop&w=600&q=80","https://images.unsplash.com/photo-1523731407965-2430cd12f5e4?auto=format&fit=crop&w=600&q=80"];
let name=localStorage.getItem("vantaName")||"";

function card(item,progress=0,wide=false){return `<div class="card ${wide?'wide':''}" onclick="route('/details')"><div class="poster"><img loading="lazy" src="${item[1]}"><span class="badge">HD</span></div><div class="cardinfo"><div class="cardtitle">${item[0]}</div><div class="sub">${item[2]} • ★ ${item[3]} • ${item[4]}</div>${progress?`<div class="progress"><span style="width:${progress}%"></span></div>`:""}</div></div>`}
function section(title,arr,progress=false,wide=false){return `<section class="section"><div class="sectionhead"><h2>${title}</h2><span class="muted">View all →</span></div><div class="rail">${arr.map((x,i)=>card(x,progress?[38,66,22,79][i%4]:0,wide)).join("")}</div></section>`}
function nav(){return `<nav class="nav glass"><div class="logo"><i></i>VANTA</div><div class="navlinks">${[['/','Home'],['/movies','Movies'],['/series','Series'],['/live','Live TV'],['/search','Search'],['/profile','My List']].map(x=>`<a href="#${x[0]}" class="${location.hash==='#'+x[0]?'active':''}">${x[1]}</a>`).join("")}</div><div class="navright"><button class="iconbtn" onclick="route('/search')">⌕</button><button class="iconbtn hideMob">♡</button><img class="avatar" src="https://i.pravatar.cc/100?img=12" onclick="route('/profile')"></div></nav><div class="mobilebar glass">${[['/','⌂','Home'],['/movies','▣','Movies'],['/search','⌕','Search'],['/live','◉','Live'],['/profile','●','Profile']].map(x=>`<a href="#${x[0]}"><b>${x[1]}</b>${x[2]}</a>`).join("")}</div>`}
function home(){return `<div class="page">${nav()}<section class="hero"><div class="hero-copy"><div class="eyebrow">Featured Premiere • 4K HDR</div><h1>Neon<br>Horizon</h1><div class="meta"><b>2026</b><span class="pill">Sci-Fi</span><span class="pill">8.7 ★</span><span>2h 08m</span></div><p>In a city where memories can be streamed, one signal reveals a future nobody was meant to see.</p><div class="actions"><button class="btn" onclick="route('/player')">▶ Watch Now</button><button class="btn secondary">＋ Add to List</button></div></div></section>${section("Continue Watching",movies.slice(0,5),true,true)}${section("Trending Now",movies.slice(1,7))}${section("Popular Movies",movies.slice(0,6))}${section("Popular Series",series)}${section("New Releases",[...movies.slice(3),...series.slice(0,3)])}${section("Recommended For You",movies.slice(2))}</div>`}
function listing(type){let data=type==='Movies'?movies:series;return `<div class="page">${nav()}<div class="section"><div class="eyebrow">Explore</div><h1 class="page-title">${type}</h1><p class="muted">Discover cinematic stories curated for your next watch.</p><div class="toolbar"><button class="select">All genres ▾</button><button class="select">2026 ▾</button><button class="select">Rating ▾</button><button class="select">Newest ▾</button></div><div class="grid">${data.concat(data).map(x=>card(x)).join("")}</div></div></div>`}
function search(){return `<div class="page">${nav()}<h1 class="page-title">Search</h1><div class="searchbox glass">⌕ <input id="q" autofocus placeholder="Search movies, series, genres..." oninput="doSearch(this.value)"><span>⌘ K</span></div><div class="toolbar"><button class="select">Movies</button><button class="select">Series</button><button class="select">Genre</button><button class="select">Year</button><button class="select">Language</button></div><div id="results" class="grid">${movies.concat(series).map(x=>card(x)).join("")}</div></div>`}
function doSearch(q){let data=movies.concat(series).filter(x=>x[0].toLowerCase().includes(q.toLowerCase()));document.getElementById("results").innerHTML=data.length?data.map(x=>card(x)).join(""):`<div class="empty glass" style="grid-column:1/-1"><div style="font-size:45px">⌕</div><h2>No results found</h2><p class="muted">Try another title, genre, or keyword.</p></div>`}
function live(){return `<div class="page">${nav()}<div class="hero" style="min-height:360px;margin-bottom:35px"><div class="hero-copy"><div class="eyebrow">Live right now</div><h1 style="font-size:55px">World<br>Live</h1><p>Jump into live channels, breaking news, sports, music and entertainment.</p><button class="btn">▶ Watch Live</button></div></div><h2>Live Channels</h2><div class="livegrid section">${channels.map((c,i)=>`<div class="channel glass"><img src="${imgs[i]}"><div class="channelrow"><img src="${imgs[(i+2)%6]}"><div><b>${c}</b><div class="live">● LIVE · ${["Morning Brief","Championship Live","Top 40","Movie Hour","Cartoon Club","Global Report"][i]}</div></div></div></div>`).join("")}</div><section class="section"><h2>Program Guide</h2><div class="epg glass">${["12:00","13:00","14:00","15:00","16:00"].map((t,i)=>`<div><b>${t}</b></div><div>${["Morning Brief","The Daily Arena","Vibe Sessions","Cinema Spotlight","World Tonight"][i]}</div>`).join("")}</div></section></div>`}
function profile(){return `<div class="page">${nav()}<h1 class="page-title">Profile</h1><div class="profile"><aside class="profilebox glass"><img class="avatar" src="https://i.pravatar.cc/200?img=12"><h2>${name||"Guest User"}</h2><p class="muted">Premium member</p><button class="btn secondary" onclick="route('/search')">Manage profile</button></aside><main><div class="settinglist"><div class="setting glass"><h3>Playback</h3><div class="row">Autoplay <span class="toggle on"></span></div><div class="row">Video quality <b>Auto</b></div><div class="row">Data saver <span class="toggle"></span></div></div><div class="setting glass"><h3>Subtitles & Audio</h3><div class="row">Language <b>English</b></div><div class="row">Subtitles <b>Auto</b></div><div class="row">Audio <b>Original</b></div></div><div class="setting glass"><h3>Account</h3><div class="row">Notifications <span class="toggle on"></span></div><div class="row">Plan <b>Premium</b></div><div class="row">Sign out <button class="btn secondary" onclick="logout()">Log out</button></div></div><div class="setting glass"><h3>My List</h3><p class="muted">Your saved movies and series appear here.</p><button class="btn secondary" onclick="route('/movies')">Browse titles</button></div></div></main></div></div>`}
function details(){let m=movies[0];return `<div class="page">${nav()}<section class="detail"><div class="detailcontent"><img class="detailposter" src="${m[1]}"><div class="detailtext"><div class="eyebrow">Vanta Original</div><h1>${m[0]}</h1><div class="meta"><span>${m[2]}</span><span class="pill">16+</span><span class="pill">★ ${m[3]}</span><span>${m[4]}</span><span>English</span></div><p>In a luminous future city, a mysterious broadcast begins rewriting memories. A reluctant signal engineer follows its trail across parallel realities and discovers a choice that could change everyone.</p><div class="actions"><button class="btn" onclick="route('/player')">▶ Watch Now</button><button class="btn secondary">▷ Trailer</button><button class="btn secondary">＋ Add to List</button></div><p class="muted">Starring: A. Mercer · N. Vale · R. Chen</p></div></div></section>${section("Similar Content",movies.slice(1))}<section class="section"><h2>Cast & Crew</h2><div class="cast">${["Alex Mercer","Nora Vale","Rin Chen","Maya Stone","Leo Hart"].map((p,i)=>`<div class="person"><img src="https://i.pravatar.cc/100?img=${20+i}"><b>${p}</b><small class="muted"> Cast</small></div>`).join("")}</div></section></div>`}
function player(){return `<div class="player"><div class="video-bg"></div><div class="playerui"><div><button class="iconbtn close" onclick="history.back()">✕</button><b>Neon Horizon</b><div class="muted">Chapter 04 · The Signal</div></div><div><div class="timeline"><span></span></div><div class="playercontrols" style="margin-top:15px"><button class="iconbtn">↶</button><button class="centerplay">▶</button><button class="iconbtn">↷</button><span class="muted">42:18 / 2:08:00</span><span style="margin-left:auto">CC</span><span>HD ▾</span><span>1×</span><span>🔊</span><span>⛶</span></div></div></div></div>`}
function welcome(){return `<div id="welcome"><div class="welcome-card glass"><div class="logo" style="justify-content:center"><i></i>VANTA</div><h1>Welcome to Vanta</h1><p class="muted">Your cinematic universe starts here. Enter your name to personalize your experience.</p><input id="name" placeholder="Your name" value="${name}"><button class="btn" onclick="start()">Continue →</button></div></div>`}
function route(path){location.hash=path;render()}
function logout(){localStorage.removeItem("vantaName");name="";render()}
function start(){let v=document.getElementById("name").value.trim();if(v){localStorage.setItem("vantaName",v);name=v;document.getElementById("welcome")?.remove();route("/")}}
function render(){let p=location.hash.slice(1)||"/";if(!name&&p!=='/player'){document.getElementById("app").innerHTML=welcome();return}let out=p==='/'?home():p==='/movies'?listing("Movies"):p==='/series'?listing("Series"):p==='/search'?search():p==='/live'?live():p==='/profile'?profile():p==='/details'?details():p==='/player'?player():home();document.getElementById("app").innerHTML=out}
window.addEventListener("hashchange",render);render();
</script>
</body>
</html>
